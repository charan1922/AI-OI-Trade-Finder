# Builds the Docker image on GitHub's machines (free) and pushes it to the
# GitHub Container Registry (ghcr.io). The AWS box then only PULLS this image —
# it never builds (so a tiny 2 GB box is enough).
#
# CI/CD model — building is separate from PUBLISHING (PR#7 review):
#   • PR to `main`      → validate + BUILD the runtime image + smoke-test it
#                         (no g++, native module loads, boots on a fresh DB and
#                         answers HTTP). NEVER pushed.
#   • push to `prod`    → validate + build + PUSH `:latest` (+ sha-*); the box pulls it.
#   • workflow_dispatch → validate + build + smoke-test, NEVER pushed — so a manual
#                         run on main/any branch can't overwrite production `latest`.
# Publishing is gated on `event==push && ref==refs/heads/prod`; the ghcr login and
# push both carry that condition, nothing else can publish.
#
# Speed/cost: buildx layer caching via the GitHub Actions cache (type=gha).
# GitHub runners start empty every run — without this cache every build redoes
# pnpm install + next build (~6 min) and re-pushes the ~1 GB node_modules layer.
# With it, unchanged layers (deps especially) are restored and the push skips
# blobs the registry already has, so a typical source-only change builds in
# ~2 min and pushes only the small changed layers.
#
# No secrets to configure: the built-in GITHUB_TOKEN can push to ghcr.io.
# The image carries NO secrets or DB (see .dockerignore) — those are supplied
# at runtime on the box via --env-file and a mounted volume.
name: build-image

on:
  push:
    branches: [prod]
  pull_request:
    # PRs: validate + build the image + smoke-test it (never pushed). `prod` is
    # included so the RELEASE PR (main → prod) gets a pre-merge run of its own —
    # without it the deploy PR showed zero checks and the only validation of the
    # exact deployed tree happened AFTER the merge had already started publishing.
    branches: [main, prod]
  workflow_dispatch: {} # lets you trigger a build by hand from the Actions tab

# Least-privilege default for every job: read-only. The build job re-grants the
# one extra scope it needs (packages: write, to push to ghcr). Without this the
# validate job would inherit the repo-wide default token scope — money-touching
# CI should grant only what each job actually uses (PR#6 review 2026-07-21).
permissions:
  contents: read

jobs:
  # Money-touching code must not ship unvalidated (AT-016): typecheck + lint
  # gate the image build. The FULL auto-trade bench needs a populated SQLite DB,
  # so it stays a box/laptop step (npx tsx scripts/verify-auto-trade.ts) — but
  # the PURE quant-shadow math has no DB dependency and runs here too, so its
  # assertions are confirmed by CI, not only claimed (AT-review 2026-07-20).
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a full commit SHA (immutable) with the version in a
      # trailing comment — a moved/compromised tag can't inject code, and
      # Dependabot (.github/dependabot.yml) reads the comment to open version-bump
      # PRs, so pinning stays current without manual chasing (PR#6 review).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # match the Dockerfile base (node:24-bookworm-slim)
      # Provide pnpm exactly as the Docker image does (npm global install of the
      # same major). Avoids pnpm/action-setup, whose Node 20 runtime GitHub is
      # deprecating, and keeps CI on the pnpm major the lockfile + image use.
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      # The root tsconfig excludes scripts/, so the verification benches were
      # never typechecked — a required field added to EntryGateInput left several
      # gate fixtures invalid while `pnpm typecheck` stayed green, and it only
      # surfaced as a runtime FAIL further down this job (PR#18). These benches
      # assert the money-touching rules; they must not drift from the types.
      - run: pnpm typecheck:scripts
      # Runs BEFORE lint so the clearest failure surfaces first. `typecheck` and
      # `typecheck:scripts` both read node_modules, where pnpm hoists transitive
      # packages — so an import of an UNDECLARED package resolves fine on a dev
      # machine and only explodes here on the clean --frozen-lockfile install
      # (dotenv in measure-option-evidence.ts, TS2307, 2026-08-11). This check
      # compares imports against package.json itself, so it reproduces locally.
      - run: pnpm exec tsx scripts/verify-dependency-hygiene.ts
      # The Dockerfile's runtime stage pins `playwright@<v> install-deps` so that
      # apt layer can cache; the browser BINARY comes from the builder at the
      # lockfile's version. Two sources, one number — drift would pair one
      # Chromium's OS libs with another's binary and only fail on the box, mid
      # session. Cheap to check, expensive to discover.
      - run: pnpm exec tsx scripts/verify-playwright-pin.ts
      - run: pnpm lint
      # DB-free pure checks: quant-shadow math (re-anchor, observed-baseline
      # MFE/MAE, entry-candle exclusion, chgOpen bucketing, sector-rate rank) AND
      # the config-drift override detector (toggle + numeric window/pick drift).
      # tsx is a PINNED devDependency run via `pnpm exec` (not `npx --yes`, which
      # downloads an unpinned tsx each run) — reproducible + no runtime fetch
      # (PR#6 review). It resolves the tsconfig @/ path aliases like the box does.
      - run: pnpm exec tsx scripts/verify-quant-shadow.ts
      # Real stock-option resolver boundary against an isolated SQLite database:
      # Prisma DateTime round-trip, CE/PE + selected-month SQL, nearest-strike
      # row identity, expiry-week rollover, no-next-month fail-closed behavior,
      # and stale/mixed master snapshot rejection (PR#21 review).
      - run: pnpm exec tsx scripts/verify-option-resolver-store.ts
      # DB-free pure checks for the capped priority-refresh planner (round-robin
      # fairness, Tier 0/1/2 tiering, the 40-unique cap, sector promotion inside
      # the cap). Same reproducible `pnpm exec tsx` runner as above.
      - run: pnpm exec tsx scripts/verify-priority-refresh.ts
      # DB-free pure checks for the candle-freshness rule + the auto-trade
      # stale-candle ENTRY gate (fresh→allow, stale/missing→reject, block OFF→
      # existing gates decide). Same reproducible `pnpm exec tsx` runner.
      - run: pnpm exec tsx scripts/verify-freshness-gate.ts
      # DB-free, network-free checks for the NSE pulse cache's latency guards:
      # concurrent-miss coalescing, the post-failure cooldown, the per-caller
      # wait cap and its honest stale flagging. POST /api/live/quote awaits this
      # feed and the /live client gives up after 8s, while an NSE miss from a
      # datacentre IP can run for tens of seconds — that mismatch is what filled
      # the network tab with `(canceled)` quotes on 2026-08-12.
      - run: pnpm exec tsx scripts/verify-nse-pulse-cache.ts
      # DB-free contract for AI context/tool selection: management passes see
      # only held-symbol signals and one authoritative held plan; commentary
      # cards match that context; global blockers suppress entry tools; MiMo
      # runtime/env model selection is allowlisted and migration-safe.
      - run: pnpm exec tsx scripts/verify-ai-decision-context.ts
      # Priority-refresh STORE round-trip against an isolated throwaway SQLite DB
      # (chdir to a temp dir first): proves the tables create, the Prisma
      # transaction + SQL param counts work, timestamps round-trip, and the
      # empty-batch / atomic-replace semantics hold — DB behaviour the pure checks
      # and the container smoke test don't exercise (PR#11 re-review).
      - run: pnpm exec tsx scripts/verify-priority-refresh-store.ts
      # DB-free checks for the CASH-TARGET math and both exit-executability
      # rules (REST + stream), plus reconnect backoff, token rotation and the
      # stream silence watchdog. v1.26.0 shipped this money math covered only by
      # scripts/verify-auto-trade.ts, which needs a populated DB and so never ran
      # here — a green deploy proved nothing about it (AT-REVIEW 2026-07-23).
      - run: pnpm exec tsx scripts/verify-auto-target-stream.ts
      # Auto-trade quote-snapshot STORE round-trip against an isolated throwaway
      # SQLite DB: the additive bidQty/askQty migration onto a table created
      # before those columns existed, size round-tripping, batched multi-row
      # param counts, and 20-session retention (PR#16 review).
      - run: pnpm exec tsx scripts/verify-auto-trade-store.ts
      # Invalid MiMo model configuration must not disable risk settings or the
      # deterministic guard. Runs against isolated SQLite with no stored model.
      - run: pnpm exec tsx scripts/verify-auto-trade-settings-safety.ts
      # trade_commentary STORE round-trip against an isolated throwaway SQLite DB:
      # the viewer-privacy flag must store PRIVATE on BOTH installation paths —
      # a freshly CREATEd table and a legacy table upgraded by the additive ALTER.
      # The pure helper check cannot see the DDL, and the DDL disagreed with it:
      # CREATE said DEFAULT 0 (public) while ALTER said 1 (PR#27 re-review).
      - run: pnpm exec tsx scripts/verify-commentary-store.ts
      # DB-free pure checks for the ACCESS policy (lib/auth/rbac.ts): the owner
      # can never be locked out or downgraded, only the owner reaches /users, an
      # owner revoke beats the hardcoded admin list, and an unreachable database
      # (empty registry) fails closed rather than open.
      - run: pnpm exec tsx scripts/verify-user-access.ts
      # app_users round-trip against an isolated throwaway SQLite DB: add before
      # first sign-in, role change, revoke-as-tombstone, restore, owner immunity,
      # and the rule that a later sign-in cannot re-promote a downgraded operator.
      - run: pnpm exec tsx scripts/verify-user-access-store.ts

  build:
    needs: validate
    # Runs on EVERY trigger now (PR#7 review): PRs and manual dispatch build +
    # smoke-test the image; only a real prod push publishes it (see the publish
    # condition below). Building on PRs is what proves the exact runtime container
    # actually boots BEFORE it can reach prod.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only exercised on a real prod-push publish (login/push are gated)
    env:
      # Single source of truth for "is this the deploy publish?" — a real push to
      # the prod branch. Everything else builds + smoke-tests without pushing, so a
      # workflow_dispatch on any branch can NEVER overwrite production `latest`.
      # Reverted to push-only on 2026-08-07: the workflow_dispatch escape hatch
      # added the previous day existed only because a GitHub Actions major
      # outage (2026-08-06 15:22 UTC) stopped push events from creating runs at
      # all. Actions is operational again, so the narrower rule is back.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/project-r-simulator
    steps:
      # SHA-pinned (see the validate job's note); comments carry the version, all
      # on Node 24 runtimes (Node 20 is deprecated on GitHub runners).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Log in ONLY when we are actually publishing (real prod push). A PR / manual
      # dispatch never authenticates to the registry — it can't push.
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push only on a real prod deploy)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          # Publish only on a prod push. Otherwise `load` the built image into the
          # runner's docker so the smoke test below can actually run it.
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          # `latest` is the box's auto-pull alias; the sha-* tag is the
          # commit-addressed rollback target (not registry-immutable unless the
          # package enforces it — treated as an operational rollback id).
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the EXACT runtime container works, on non-publish runs (PR / dispatch)
      # — this is what makes "PRs build the image" meaningful (PR#7 review Blocker 1):
      #   1. the compiler is gone from the runtime stage,
      #   2. the trading-critical native module (better-sqlite3) + Prisma adapter load,
      #   3. the container boots on a FRESH DB (prisma db push → next start) and
      #      answers HTTP — i.e. the autonomous server would actually come up.
      - name: Smoke test the runtime image
        if: env.PUBLISH != 'true'
        env:
          REF: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail

          echo "::group::runtime stage has no C/C++ compiler"
          docker run --rm --entrypoint sh "$REF" -lc '! command -v g++ && echo "OK: no g++ in runtime"'
          echo "::endgroup::"

          echo "::group::native module + Prisma adapter load (no toolchain)"
          docker run --rm --entrypoint node "$REF" -e "const D=require('better-sqlite3');const db=new D(':memory:');db.exec('create table t(x)');db.prepare('insert into t values(1)').run();console.log('better-sqlite3 OK',JSON.stringify(db.prepare('select count(*) c from t').get()));require('@prisma/adapter-better-sqlite3');console.log('prisma adapter OK')"
          echo "::endgroup::"

          echo "::group::container boots on a fresh DB and answers HTTP"
          tmp="$(mktemp -d)"
          docker run -d --name pr-smoke -e PORT=5001 -v "$tmp:/app/data" -p 5001:5001 "$REF"
          ok=0
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5001/ || echo 000)"
            if [ "$code" != "000" ]; then echo "HTTP responded ($code) after $((i*2))s"; ok=1; break; fi
            sleep 2
          done
          echo "---- last 40 lines of container log ----"
          docker logs pr-smoke 2>&1 | tail -40 || true
          docker rm -f pr-smoke >/dev/null 2>&1 || true
          [ "$ok" = "1" ] || { echo "::error::runtime container did not answer HTTP within 120s"; exit 1; }
          echo "::endgroup::"
