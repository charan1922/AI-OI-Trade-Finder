# Builds the Docker image on GitHub's machines (free) and pushes it to the
# GitHub Container Registry (ghcr.io). The AWS box then only PULLS this image —
# it never builds (so a tiny 2 GB box is enough).
#
# CI/CD model: ONLY a push to `prod` builds/deploys.
#   • push to `prod` → tag `:latest` — the DEPLOY image the box auto-pulls.
#   • push to `main` → NOTHING (main is for integration; it never deploys).
#
# Speed/cost: buildx layer caching via the GitHub Actions cache (type=gha).
# GitHub runners start empty every run — without this cache every build redoes
# pnpm install + next build (~6 min) and re-pushes the ~1 GB node_modules layer.
# With it, unchanged layers (deps especially) are restored and the push skips
# blobs the registry already has, so a typical source-only change builds in
# ~2 min and pushes only the small changed layers.
#
# No secrets to configure: the built-in GITHUB_TOKEN can push to ghcr.io.
# The image carries NO secrets or DB (see .dockerignore) — those are supplied
# at runtime on the box via --env-file and a mounted volume.
name: build-image

on:
  push:
    branches: [prod]
  pull_request:
    branches: [main] # run the validate gate on PRs (typecheck+lint) — no image build
  workflow_dispatch: {} # lets you trigger a build by hand from the Actions tab

# Least-privilege default for every job: read-only. The build job re-grants the
# one extra scope it needs (packages: write, to push to ghcr). Without this the
# validate job would inherit the repo-wide default token scope — money-touching
# CI should grant only what each job actually uses (PR#6 review 2026-07-21).
permissions:
  contents: read

jobs:
  # Money-touching code must not ship unvalidated (AT-016): typecheck + lint
  # gate the image build. The FULL auto-trade bench needs a populated SQLite DB,
  # so it stays a box/laptop step (npx tsx scripts/verify-auto-trade.ts) — but
  # the PURE quant-shadow math has no DB dependency and runs here too, so its
  # assertions are confirmed by CI, not only claimed (AT-review 2026-07-20).
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a full commit SHA (immutable) with the version in a
      # trailing comment — a moved/compromised tag can't inject code, and
      # Dependabot (.github/dependabot.yml) reads the comment to open version-bump
      # PRs, so pinning stays current without manual chasing (PR#6 review).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # match the Dockerfile base (node:24-bookworm-slim)
      # Provide pnpm exactly as the Docker image does (npm global install of the
      # same major). Avoids pnpm/action-setup, whose Node 20 runtime GitHub is
      # deprecating, and keeps CI on the pnpm major the lockfile + image use.
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      # DB-free pure checks: quant-shadow math (re-anchor, observed-baseline
      # MFE/MAE, entry-candle exclusion, chgOpen bucketing, sector-rate rank) AND
      # the config-drift override detector (toggle + numeric window/pick drift).
      # tsx is a PINNED devDependency run via `pnpm exec` (not `npx --yes`, which
      # downloads an unpinned tsx each run) — reproducible + no runtime fetch
      # (PR#6 review). It resolves the tsconfig @/ path aliases like the box does.
      - run: pnpm exec tsx scripts/verify-quant-shadow.ts

  build:
    needs: validate
    # A PR to main only runs the validate gate above — it must never build or
    # push an image (deploy stays prod-only). Prod pushes + manual dispatch build.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # allows pushing to ghcr.io
    steps:
      # SHA-pinned (see the validate job's note); comments carry the version, all
      # on Node 24 runtimes (Node 20 is deprecated on GitHub runners).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # Image name must be lowercase for ghcr — the repo owner + a fixed name.
          # `latest` is the box's auto-pull convenience alias; the sha-* tag is
          # the IMMUTABLE identity (AT-017) — exact rollback target, and the
          # running code is identifiable from the commit it was built from.
          tags: |
            ghcr.io/${{ github.repository_owner }}/project-r-simulator:latest
            ghcr.io/${{ github.repository_owner }}/project-r-simulator:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
