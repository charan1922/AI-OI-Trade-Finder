# Builds the Docker image on GitHub's machines (free) and pushes it to the
# GitHub Container Registry (ghcr.io) on every push to main. The AWS VM then
# only PULLS this image — it never has to build (so a tiny 1 GB box is enough).
#
# No secrets to configure: the built-in GITHUB_TOKEN can push to ghcr.io.
# The image carries NO secrets or DB (see .dockerignore) — those are supplied
# at runtime on the VM via --env-file and a mounted volume.
name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a build by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # allows pushing to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Image name must be lowercase for ghcr — the repo owner + a fixed name.
          tags: ghcr.io/${{ github.repository_owner }}/project-r-simulator:latest
