# Market-hours autoscale — run the Railway service ONLY during Indian market
# hours, fully off (0 replicas, no compute billing) nights + weekends.
#
# The Fyers poller runs from the server (instrumentation.ts) whenever the service
# is up — no browser needed. So "up during market hours" = the poller records and
# /trade-suggest, /live, /nse/movers, /fyers all have fresh data autonomously.
#
# Deterministic (not traffic-based): the service stays continuously UP across the
# whole window — no cold-start churn mid-session — then scales to 0 for the night.
# Weekends (Sat/Sun) never scale up, so the service is off Fri evening → Mon morning.
#
# Requires a repo secret RAILWAY_API_TOKEN (Railway → Account → Tokens; then
# GitHub repo → Settings → Secrets and variables → Actions). See DEPLOY.md.
#
# GitHub cron is UTC and best-effort (can be delayed/occasionally skipped under
# load) — hence a backup fire for each direction. Scaling up when already up (or
# down when already down) is a harmless no-op. IST = UTC + 5:30.
name: market-hours

on:
  schedule:
    - cron: '45 2 * * 1-5'    # 08:15 IST Mon-Fri — scale UP (primary, before 09:15 open)
    - cron: '15 3 * * 1-5'    # 08:45 IST Mon-Fri — scale UP (backup if primary skipped)
    - cron: '40 10 * * 1-5'   # 16:10 IST Mon-Fri — scale DOWN (primary, after 15:30 close)
    - cron: '10 11 * * 1-5'   # 16:40 IST Mon-Fri — scale DOWN (backup)
  workflow_dispatch:
    inputs:
      action:
        description: 'Manual scale: up (1 replica) or down (0)'
        required: true
        default: 'up'
        type: choice
        options: [up, down]

jobs:
  scale:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Decide replica count
        id: d
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}:${{ github.event.inputs.action }}" in
            workflow_dispatch:*:up)   R=1 ;;
            workflow_dispatch:*:down) R=0 ;;
            schedule:'45 2 * * 1-5':*)  R=1 ;;
            schedule:'15 3 * * 1-5':*)  R=1 ;;
            schedule:'40 10 * * 1-5':*) R=0 ;;
            schedule:'10 11 * * 1-5':*) R=0 ;;
            *) echo "unrecognized trigger"; exit 1 ;;
          esac
          echo "replicas=$R" >> "$GITHUB_OUTPUT"
          echo "Scaling to sfo=$R"

      - name: Scale service
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway scale \
            --project d5d24ef5-cd81-401e-a3d4-b319ef66e4bf \
            --environment a6fcc8f0-dec3-4b56-abdb-6bcf5e513a54 \
            --service a5ce553b-bbd1-4699-8465-6ff34aeac202 \
            sfo=${{ steps.d.outputs.replicas }}
